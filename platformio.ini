[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 230400
upload_speed = 2000000
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_src_filter =
    +<*>
    -<OledSpiTest.cpp>
; AudioTools' legacy ESP32 I2S backend matches the MAX98357A/Core-2 style
; framing used by the proven direct-tone test.  The mic already uses I2S0;
; audio output stays independently on I2S1.
build_flags = -DUSE_LEGACY_I2S=true
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    bblanchon/ArduinoJson @ ^7.2.0
    olikraus/U8g2 @ ^2.35.30
    madhephaestus/ESP32Servo @ ^3.0.6
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.2
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.2

[env:esp32-s3-super-mini]
extends = env:esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_super_mini.csv
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1


; Isolated playback check using schreibfaul1's ESP32-audioI2S decoder.
; It deliberately retains Voxie's wired MAX98357A pins: BCLK=13, LRC=12,
; DIN=14.  It plays Cute1.mp3 from the existing LittleFS partition, so no
; SD reader/card or rewiring is involved.
[env:schreibfaul-mp3-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 2000000
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags = -DSCHREIBFAUL_MP3_TEST
build_src_filter =
    -<*>
    +<SchreibfaulMp3Test.cpp>
lib_deps =
    LittleFS
    ; 2.0.6 is the last non-PSRAM release.  This S3's configured N8 target
    ; has no usable PSRAM, while the current 3.x/4.x releases require it.
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6

; Mic-only bring-up: live level meter over Serial, plus a raw PCM stream mode
; that tools/mic_terminal.py --transcribe turns into printed words on the PC.
; Text runs at 230400; "stream on" switches to 921600 because 16 kHz x 16-bit
; PCM (256 kbit/s) won't fit in 230400.
[env:mic-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 230400
upload_speed = 2000000
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_amplifier_test.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
build_flags = -DMIC_TEST -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    -<*>
    +<MicTest.cpp>
